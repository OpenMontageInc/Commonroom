name: Bug report
description: Report a reproducible problem with Commonroom
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in the fields below so it can be reproduced and triaged quickly.
        For questions or help, use [GitHub Discussions](https://github.com/OpenMontageInc/Commonroom/discussions) instead.
        Security problems: please [report them privately](https://github.com/OpenMontageInc/Commonroom/security/policy).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, one-paragraph description of the bug.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11 24H2, macOS 15.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commonroom version
      description: The installer version, or the commit hash if you run from source.
      placeholder: e.g. 0.1.0, or main @ 3221c4e
    validations:
      required: true
  - type: textarea
    id: providers
    attributes:
      label: Agent tools involved
      description: Which providers were in the room, and their versions (the setup screen shows them, or run `<tool> --version`).
      placeholder: |
        Claude Code 2.1.0
        Codex CLI 0.60.0
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact actions that trigger the bug.
      placeholder: |
        1. Open a project folder
        2. Add an agent with ...
        3. Send "..."
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: backend.log excerpt
      description: |
        The relevant lines from the desktop app's `backend.log` (Windows: `%APPDATA%\Commonroom\logs\backend.log`;
        macOS: `~/Library/Logs/Commonroom/backend.log`, or `~/Library/Application Support/Commonroom Desktop/logs/backend.log` when the desktop app runs from source).
        Running only the service from source? Paste the console output of `python -m commonroom` instead.
        **Remove anything private first**: project paths, file contents, prompts, account names or tokens.
      render: shell
    validations:
      required: false
