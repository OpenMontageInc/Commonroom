name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.10"
          - os: macos-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run test suite
        run: python -m pytest tests -q

  desktop:
    name: Desktop
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Run desktop tests
        working-directory: desktop
        run: npm test

      - name: Check desktop scripts parse
        working-directory: desktop
        shell: bash
        run: |
          for file in *.cjs platform/*.cjs; do
            node --check "$file"
          done

      - name: Check macOS launcher parses and is executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash -n "Start Commonroom.command"
          test -x "Start Commonroom.command"
